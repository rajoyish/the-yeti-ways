<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flow Music Score Runner</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Flow Music Score Runner</h1>
    <span id="pill" class="pill">Looking for Flow Music…</span>
  </header>

  <section>
    <h2>1. Inputs</h2>
    <label class="drop" id="guideDrop">
      <input type="file" id="guideFile" accept=".md,text/markdown" hidden>
      <strong>Music guide (.md)</strong>
      <span id="guideName">Drop music-prompts/&lt;film&gt;-flow-music.md, or click to browse</span>
    </label>
    <label class="drop" id="refDrop">
      <input type="file" id="refFile" accept=".wav,audio/wav" hidden>
      <strong>Reference voice track (.wav)</strong>
      <span id="refName">Drop story-full.wav: the score is cut to its exact length</span>
    </label>
  </section>

  <section>
    <h2>2. Settings</h2>
    <div class="grid">
      <label>Model
        <select id="model"><option>Lyria 3.5</option><option>Lyria 3 Pro</option></select>
      </label>
      <label>Crossfade (s)
        <input type="number" id="crossfade" min="1" max="8" step="0.5" value="3">
      </label>
      <label>Output rate
        <select id="sampleRate"><option value="48000">48 kHz</option><option value="44100">44.1 kHz</option></select>
      </label>
      <label>Bit depth
        <select id="bits"><option value="24">24-bit</option><option value="16">16-bit</option></select>
      </label>
      <label>Peak (dBFS)
        <input type="number" id="peakDb" min="-12" max="0" step="0.5" value="-1">
      </label>
      <label class="check"><input type="checkbox" id="saveTakes" checked> Save each take too</label>
    </div>
  </section>

  <section>
    <h2>3. Movements</h2>
    <p class="hint" id="planHint">Load a music guide to see its movements.</p>
    <table id="jobs">
      <thead><tr><th><input type="checkbox" id="all"></th><th>Movement</th><th>Window</th><th>Take</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row">
      <button id="genSel" class="primary">Generate selected</button>
      <button id="stop">Stop</button>
    </div>
  </section>

  <section>
    <h2>4. Score</h2>
    <div class="row">
      <button id="build" class="primary">Build score WAV</button>
      <audio id="preview" controls hidden></audio>
    </div>
    <p class="hint" id="buildInfo"></p>
  </section>

  <section>
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>

  <script src="plan.js"></script>
  <script src="score.js"></script>
  <script src="panel.js"></script>
</body>
</html>
